ref: yt_dlp.media_available
label: "Media Available"
description: "Emitted when a media item first matches or changes to a configured availability state"
enabled: true
type: media

parameters:
  source_url:
    type: string
    description: "HTTP or HTTPS media, channel, user, or playlist URL to inspect"
    required: true
  live_statuses:
    type: array
    description: "yt-dlp live_status values that should emit events"
    default: [is_live, is_upcoming]
    required: true
    items:
      type: string
      enum: [is_live, is_upcoming, was_live, post_live, not_live, unknown]
  poll_interval_seconds:
    type: integer
    description: "Seconds between metadata checks for this rule"
    default: 300
    minimum: 5
    maximum: 86400
  socket_timeout_seconds:
    type: integer
    description: "Timeout for each network socket operation"
    default: 30
    minimum: 1
    maximum: 600
  max_entries:
    type: integer
    description: "Maximum collection entries inspected during one poll"
    default: 50
    minimum: 1
    maximum: 500
  emit_initial:
    type: boolean
    description: "Emit items already in a matching state when monitoring starts"
    default: true

output:
  media_id:
    type: string
    required: true
  source_url:
    type: string
    required: true
  media_url:
    type: string
    required: true
  title:
    type: string
    required: true
  extractor:
    type: string
    required: true
  live_status:
    type: string
    required: true
  is_live:
    type: boolean
    required: true
  scheduled_at:
    type: string
    format: date-time
  duration_seconds:
    type: number
  channel:
    type: string
  playlist:
    type: string
  discovered_at:
    type: string
    format: date-time
    required: true

tags: [media, streaming, polling]
examples:
  - description: "Watch a channel for live and scheduled streams"
    parameters:
      source_url: "https://www.youtube.com/@example/streams"
      live_statuses: [is_live, is_upcoming]
      poll_interval_seconds: 300
