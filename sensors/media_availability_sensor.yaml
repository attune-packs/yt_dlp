ref: yt_dlp.media_availability_sensor
label: "Media Availability Sensor"
description: "Polls yt-dlp-supported media sources and emits availability changes"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: media_availability_sensor.py
trigger_types:
  - yt_dlp.media_available
poll_interval: 5
log_retention_policy: versions
log_retention_limit: 4
tags: [media, streaming, polling]
