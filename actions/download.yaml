ref: yt_dlp.download
label: "Download Media"
description: "Downloads on-demand media or records a live stream through the yt-dlp Python library"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: download.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]

parameters:
  url:
    type: string
    description: "HTTP or HTTPS media or playlist URL"
    required: true
  filename_template:
    type: string
    description: "yt-dlp filename template without directory components"
    default: "%(title)s [%(id)s].%(ext)s"
  format:
    type: string
    description: "Optional yt-dlp format selector"
  playlist:
    type: boolean
    description: "Allow the URL to download all playlist entries"
    default: false
  yt_dlp_options:
    type: object
    description: "Additional non-file-producing YoutubeDL options; managed paths, credentials, callbacks, postprocessors, JavaScript runtimes, and external executables are rejected"
    default: {}

output:
  media:
    type: array
    required: true
  media_count:
    type: integer
    required: true
  artifact_count:
    type: integer
    required: true
  artifacts:
    type: array
    required: true

tags: [media, download, streaming, archive]
